# Asterism public API + site. /health and /api/stats stay local.
server {
  listen 80;
  server_name __HOST__;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  http2 on;
  server_name __HOST__;
  ssl_certificate     /etc/letsencrypt/live/__HOST__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 16k;
  location = /health { return 404; }
  location = /api/stats { return 404; }
  location / {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:5190;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
}
