# solquorum.xyz before its certificate exists: HTTP only, ACME path open.
# deploy/domain-cutover.sh replaces this with nginx-domain.conf.
server {
  listen 80;
  listen [::]:80;
  server_name solquorum.xyz www.solquorum.xyz;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location = /health { return 404; }
  location = /api/stats { return 404; }
  location / {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:5190;
    proxy_set_header Host $host;
  }
}
