# solquorum.xyz: site + public API from the smart-wallet-alerts service.
# /health and /api/stats stay local. www redirects to the apex.
server {
  listen 80;
  listen [::]:80;
  server_name solquorum.xyz www.solquorum.xyz;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://solquorum.xyz$request_uri; }
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.solquorum.xyz;
  ssl_certificate     /etc/letsencrypt/live/solquorum.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/solquorum.xyz/privkey.pem;
  return 301 https://solquorum.xyz$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name solquorum.xyz;
  ssl_certificate     /etc/letsencrypt/live/solquorum.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/solquorum.xyz/privkey.pem;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 16k;
  location = /health { return 404; }
  location = /api/stats { return 404; }
  location / {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:5190;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
}
