# solasterism.xyz: the project's old name. Every URL redirects to solquorum.xyz.
# Port 80 keeps the ACME path so the old certificate still renews.
server {
  listen 80;
  listen [::]:80;
  server_name solasterism.xyz www.solasterism.xyz;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://solquorum.xyz$request_uri; }
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name solasterism.xyz www.solasterism.xyz;
  ssl_certificate     /etc/letsencrypt/live/solasterism.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/solasterism.xyz/privkey.pem;
  return 301 https://solquorum.xyz$request_uri;
}
