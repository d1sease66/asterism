<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#17191c"/>
      <stop offset=".55" stop-color="#0c0d0f"/>
      <stop offset="1" stop-color="#08090a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4b860" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#f4b860" stop-opacity=".08"/>
      <stop offset="1" stop-color="#f4b860" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7c2"/>
      <stop offset=".5" stop-color="#f4b860"/>
      <stop offset="1" stop-color="#c98222"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="640" height="640">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="640" height="640">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <!-- faint field stars -->
  <g fill="#f2f4f3">
    <circle cx="132" cy="168" r="1.6" opacity=".35"/><circle cx="508" cy="142" r="1.3" opacity=".3"/>
    <circle cx="470" cy="500" r="1.5" opacity=".3"/><circle cx="168" cy="470" r="1.2" opacity=".25"/>
    <circle cx="240" cy="110" r="1" opacity=".25"/><circle cx="560" cy="330" r="1.1" opacity=".25"/>
    <circle cx="96" cy="330" r="1" opacity=".22"/><circle cx="380" cy="560" r="1" opacity=".22"/>
  </g>
  <!-- the asterism: three wallets joined to the main star -->
  <g stroke="#f4b860" stroke-width="2.4" stroke-linecap="round" opacity=".75" fill="none">
    <path d="M320 320 L452 206 L498 292"/>
    <path d="M320 320 L206 424"/>
  </g>
  <g fill="#fff4e3" filter="url(#soft)">
    <circle cx="452" cy="206" r="8"/>
    <circle cx="498" cy="292" r="6"/>
    <circle cx="206" cy="424" r="7"/>
  </g>
  <circle cx="320" cy="320" r="200" fill="url(#halo)"/>
  <!-- main four-point star (same path as the site mark) -->
  <g filter="url(#glow)">
    <g transform="translate(320 320) scale(9.6) translate(-12 -12)">
      <path fill="url(#star)" d="M12 1.5c.5 5.6 4.9 10 10.5 10.5-5.6.5-10 4.9-10.5 10.5C11.5 16.9 7.1 12.5 1.5 12 7.1 11.5 11.5 7.1 12 1.5Z"/>
    </g>
  </g>
</svg>
