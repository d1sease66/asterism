<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#17191c"/>
      <stop offset=".55" stop-color="#0c0d0f"/>
      <stop offset="1" stop-color="#08090a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4b860" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#f4b860" stop-opacity=".05"/>
      <stop offset="1" stop-color="#f4b860" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7c2"/>
      <stop offset=".5" stop-color="#f4b860"/>
      <stop offset="1" stop-color="#c98222"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="640" height="640">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="320" cy="320" r="240" fill="url(#halo)"/>
  <!-- faint field: wallets that did not agree -->
  <g fill="#f2f4f3">
    <circle cx="118" cy="160" r="2" opacity=".3"/><circle cx="530" cy="132" r="1.6" opacity=".28"/>
    <circle cx="512" cy="520" r="1.8" opacity=".28"/><circle cx="130" cy="500" r="1.5" opacity=".24"/>
    <circle cx="250" cy="84" r="1.3" opacity=".22"/><circle cx="574" cy="340" r="1.4" opacity=".22"/>
    <circle cx="70" cy="330" r="1.3" opacity=".2"/><circle cx="390" cy="574" r="1.3" opacity=".2"/>
  </g>
  <g filter="url(#glow)">
    <!-- the quorum: a ring, three wallets joined inside it -->
    <circle cx="320" cy="320" r="196" fill="none" stroke="url(#gold)" stroke-width="30"/>
    <path d="M320 197 L425 379 L215 379 Z" fill="none" stroke="#f4b860" stroke-width="12" stroke-linejoin="round" opacity=".55"/>
    <g fill="url(#gold)">
      <circle cx="320" cy="197" r="44"/>
      <circle cx="425" cy="379" r="44"/>
      <circle cx="215" cy="379" r="44"/>
    </g>
  </g>
</svg>
